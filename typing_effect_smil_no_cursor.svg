<svg width="100%" viewBox="0 0 680 220" xmlns="http://www.w3.org/2000/svg" role="img" style="">
<title style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">Typing effect showing four lines appearing one after another, each staying visible in its own color</title>
<desc style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">EAT MEOW, SLEEP MEOW, CODE MEOW, REPEAT are revealed left to right one below the other, staying on screen until the cycle resets, using native SVG animation.</desc>
<defs>
<clipPath id="cp1"><rect x="0" y="0" width="0" height="50"/></clipPath>
<clipPath id="cp2"><rect x="0" y="0" width="0" height="50"/></clipPath>
<clipPath id="cp3"><rect x="0" y="0" width="0" height="50"/></clipPath>
<clipPath id="cp4"><rect x="0" y="0" width="0" height="50"/></clipPath>
</defs>
<g transform="translate(80,30)" clip-path="url(#cp1)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
<text x="0" y="30" font-family="Fira Code, monospace" font-weight="700" font-size="30" fill="#FF2FA0" style="fill:rgb(255, 47, 160);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Fira Code&quot;, monospace;font-size:30px;font-weight:700;text-anchor:start;dominant-baseline:auto">EAT MEOW</text>
</g>
<g transform="translate(80,70)" clip-path="url(#cp2)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
<text x="0" y="30" font-family="Fira Code, monospace" font-weight="700" font-size="30" fill="#2FD8FF" style="fill:rgb(47, 216, 255);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Fira Code&quot;, monospace;font-size:30px;font-weight:700;text-anchor:start;dominant-baseline:auto">SLEEP MEOW</text>
</g>
<g transform="translate(80,110)" clip-path="url(#cp3)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
<text x="0" y="30" font-family="Fira Code, monospace" font-weight="700" font-size="30" fill="#38FF7A" style="fill:rgb(56, 255, 122);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Fira Code&quot;, monospace;font-size:30px;font-weight:700;text-anchor:start;dominant-baseline:auto">CODE MEOW</text>
</g>
<g transform="translate(80,150)" clip-path="url(#cp4)" style="fill:rgb(0, 0, 0);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:anthropic-sans, -apple-system, BlinkMacSystemFont, &quot;Segoe UI&quot;, sans-serif;font-size:16px;font-weight:400;text-anchor:start;dominant-baseline:auto">
<text x="0" y="30" font-family="Fira Code, monospace" font-weight="700" font-size="30" fill="#C17BFF" style="fill:rgb(193, 123, 255);stroke:none;color:rgb(11, 11, 11);stroke-width:1px;stroke-linecap:butt;stroke-linejoin:miter;opacity:1;font-family:&quot;Fira Code&quot;, monospace;font-size:30px;font-weight:700;text-anchor:start;dominant-baseline:auto">REPEAT</text>
</g>
</svg>